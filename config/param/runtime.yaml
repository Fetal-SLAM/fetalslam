# Shared runtime defaults. Profiles override these through runtime_config,
# except system_config and tracker_config which remain top-level profile sections.
logging:
  level: INFO
  file: ''
tracking:
  image_margin: 0.1
  max_fake_features: 200
  keyframe_iou_threshold: 0.9
  max_parents: 30
  parent_repeat_iou: 0.95
  grandparent_promote_iou: 0.8
features:
  min_inliers: 50
  ransac_threshold: 4.0
  lightglue_min_confidence: 0.1
  homography_min_matches: 11
  ransac_iterations: 700
  ransac_confidence: 0.995
  corner_start_quality: 0.1
  corner_min_quality: 0.01
  corner_levels: 5
  corner_radius: 5
  corner_block_size: 3
  corner_quality_decay: 2.0
local_mapping:
  new_reconstruction_threshold: 0.9
  covisible_repeat_threshold: 0.97
  reuse_max_points: 40
  reuse_parent_count: 4
  reuse_min_observations: 15
  reuse_pixel_margin: 3
  flow_window: 21
  flow_levels: 3
  flow_back_error: 1.0
  flow_projection_error: 3.0
  flow_photometric_error: 20.0
  reuse_min_spacing: 3.0
  corner_quality: 0.005
  corner_min_quality: 0.0001
  min_baseline_depth_ratio: 0.01
  reprojection_chi2: 5.991
  min_triangulated_fraction: 0.3
optimizer:
  iterations: 10
  mono_chi2: 5.991
  stereo_chi2: 7.815
  guard_min_points: 8
  guard_behind_fraction: 0.1
  guard_median_depth_ratio: 0.8
  guard_partial_depth_ratio: 0.5
  guard_partial_fraction: 0.2
  guard_depth_span_ratio: 0.25
  guard_min_depth_span: 0.05
  guard_radius_ratio: 0.6
  guard_flattened_fraction: 0.5
  guard_min_flattened_frames: 2
  guard_baseline_ratio: 0.5
viewer:
  width: 1024
  height: 768
  window_name: Fetal SLAM Map
  focal_length: 500.0
  near_clip: 0.01
  far_clip: 1000.0
  point_size: 3.0
system_config:
  debug: false
  track_only: false
  loop_min_frame_gap: 120
  loop_cooldown_frames: 150
  loop_iou_threshold: 0.65
  loop_confirmation_count: 2
  loop_check_interval: 0
  place_candidate_count: 12
  relocalization_iou_threshold: 0.45
  relocalization_after_failures: 2
  relocalization_interval: 3
  blur_laplacian_min: 6.0
  noise_laplacian_max: 80.0
  image_contrast_min: 25.0
  triangulation_min_parallax_degrees: 1.0
  triangulation_max_depth_factor: 5.0
  triangulation_distance_ratio: 0.0
  initial_min_map_points: 50
  local_map_recovery_enabled: false
  local_point_reuse_enabled: false
  local_map_recovery_interval: 3
  local_map_recovery_min_frame_gap: 30
  local_map_recovery_candidate_count: 4
  local_map_recovery_iou_threshold: 0.3
  local_map_recovery_min_inliers: 15
  local_map_recovery_min_observations: 2
  local_map_recovery_max_points: 120
  local_map_recovery_reprojection_error: 4.0
  local_map_recovery_max_pose_jump_depth_factor: 0.1
tracker_config:
  max_kpts: 3000
loop_closing:
  covisible_iou_threshold: 0.5
  pnp_iterations: 150
  pnp_confidence: 0.995
  pnp_support_fraction: 0.5
  pnp_inlier_fraction: 0.35
  spatial_candidates: 10
  spatial_extra_candidates: 20
  confirmation_frame_tolerance: 30
reconstruction:
  pixel_sigma: 1.0
  min_parallax_degrees: 1.0
  min_triangulated: 50
  ambiguity_ratio: 0.9
  min_good_fraction: 0.9
  reprojection_sigma_factor: 4.0
  parallax_order_index: 50
